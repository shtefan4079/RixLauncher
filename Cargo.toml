[package]
name = "rix_launcher"
version = "0.1.1"
edition = "2024"
authors = ["shtefan4079"]
description = "Modern, high-performance Minecraft launcher built with Rust and Iced"
license = "MIT"
repository = "https://github.com/shtefan4079/RixLauncher"
homepage = "https://github.com/shtefan4079/RixLauncher"

[dependencies]
iced = { version = "0.14.0", features = ["svg", "tokio", "advanced", "image"] }
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "multipart"] }
tokio = { version = "1.0", features = ["full"] }
keyring = "4.2"
zip = "0.6"
sha1 = "0.10"
md-5 = "0.10"
sha2 = "0.10"
url = "2.5"
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.15"
image = "0.25"


[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { version = "0.31.14", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
wayland-sys = { version = "0.31", features = ["client"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
embed-resource = "2.5"

[dev-dependencies]
tempfile = "3"
